<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<meta name="description" content="Offline personal expense manager">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expense">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<title>Life Expense Manager</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--card2:#eceefa;--tx:#14152b;--tx2:#7a7d9c;--bd:#e3e5f3;--ac:#6c5ce7;--ac2:#a29bfe;--red:#f0556a;--grn:#22c08a;--sh:0 8px 30px rgba(60,60,120,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c14;--card:#151726;--card2:#1e2135;--tx:#f1f2ff;--tx2:#8a8eb0;--bd:#25283f;--sh:0 8px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0b0c14;--card:#151726;--card2:#1e2135;--tx:#f1f2ff;--tx2:#8a8eb0;--bd:#25283f;--sh:0 8px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
.app{max-width:460px;margin:0 auto;padding:18px 18px 120px;min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
input,select{font-family:inherit;color:var(--tx)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.5px}.top small{display:block;color:var(--tx2);font-size:12px;font-weight:600;margin-top:2px}
.ib{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:17px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.ib:active{transform:scale(.88)}
.view{display:none}.view.on{display:block}
.view.on>*{animation:up .5s cubic-bezier(.22,1,.36,1) both}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(5){animation-delay:.2s}.view.on>*:nth-child(6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,#6c5ce7,#8e7dff 55%,#b58cff);border-radius:26px;padding:20px;color:#fff;box-shadow:0 18px 40px rgba(108,92,231,.38);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.mnav{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;opacity:.95}
.mnav button{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:14px}
.big{font-size:36px;font-weight:800;letter-spacing:-1.2px;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.2);font-size:11px;font-weight:700}
.dwrap{display:flex;align-items:center;gap:14px;margin-top:16px;position:relative;z-index:1}
.dn{width:110px;height:110px;flex-shrink:0}.seg{transition:stroke-dasharray 1s cubic-bezier(.22,1,.36,1)}
.leg{flex:1;display:grid;gap:6px;font-size:11px;font-weight:600}.leg div{display:flex;align-items:center;gap:7px}.leg i{width:8px;height:8px;border-radius:3px}.leg b{margin-left:auto}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px;font-size:12px;font-weight:800;color:var(--tx2);text-transform:uppercase;letter-spacing:1px}
.sec button{font-size:12px;color:var(--ac);font-weight:700;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);text-align:left;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tile:active{transform:scale(.95)}
.ti{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;margin-bottom:10px}
.tile b{font-size:13px;display:block}.tile span{font-size:12px;color:var(--tx2);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
.list{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bd);width:100%;text-align:left;transition:background .15s}
.row:last-child{border:0}.row:active{background:var(--card2)}
.row .ti{margin:0;flex-shrink:0}.row .m{flex:1;min-width:0}.row .m b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m span{font-size:11px;color:var(--tx2);font-weight:600}
.row .a{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.day{font-size:11px;font-weight:800;color:var(--tx2);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.8px}
.empty{text-align:center;padding:34px 16px;color:var(--tx2);font-size:13px;font-weight:600}.empty div{font-size:38px;margin-bottom:8px}
.empty button{margin-top:12px;padding:10px 16px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:12px}
.search{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);font-size:14px;outline:0;transition:.2s}
.search:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(108,92,231,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fc{padding:8px 14px;border-radius:20px;background:var(--card);font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--sh);color:var(--tx2);transition:.2s}
.fc.on{background:var(--ac);color:#fff;transform:translateY(-1px)}
.bc{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.bc .h{display:flex;align-items:center;gap:12px}.bc .h .m{flex:1}.bc b{font-size:14px}.bc small{display:block;font-size:12px;color:var(--tx2);font-weight:600;margin-top:2px}
.pct{font-weight:800;font-size:16px}
.ed{display:none;gap:8px;margin-top:12px}.ed.on{display:flex;animation:up .3s both}
.ed input{flex:1;padding:11px 13px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card2);font-size:14px;outline:0}
.btn{padding:11px 16px;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:13px}
.btn.s{background:var(--card2);color:var(--tx)}.btn.d{background:rgba(240,85,106,.14);color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:18px 14px 12px;background:var(--card);border-radius:22px;box-shadow:var(--sh)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:10px;font-weight:700;color:var(--tx2)}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--ac2),var(--ac));height:0;transition:height 1s cubic-bezier(.22,1,.36,1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}.stat small{font-size:11px;color:var(--tx2);font-weight:700}.stat b{display:block;font-size:17px;margin-top:4px}
.set{display:grid;gap:10px}.set button{padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--sh);text-align:left;font-weight:700;font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{pointer-events:auto;width:calc(100% - 28px);max-width:432px;margin:0 0 14px;background:var(--card);border-radius:26px;box-shadow:0 12px 40px rgba(20,20,60,.22);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;padding:8px;border:1px solid var(--bd)}
.nb button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--tx2);padding:6px 0;transition:.25s}
.nb button span{font-size:19px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.nb button.on{color:var(--ac)}.nb button.on span{transform:translateY(-3px) scale(1.15)}
.nb .fab{width:56px;height:56px;border-radius:50%;margin:-28px auto 0;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:28px;font-weight:300;box-shadow:0 10px 24px rgba(108,92,231,.5);display:grid;place-items:center;padding:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.nb .fab:active{transform:scale(.88) rotate(90deg)}
.ov{position:fixed;inset:0;background:rgba(5,6,20,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:460px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 16px}
.sheet h2{font-size:17px;font-weight:800;margin-bottom:14px}
.amt{display:flex;align-items:baseline;gap:8px;justify-content:center;margin:6px 0 16px}.amt span{font-size:22px;font-weight:700;color:var(--tx2)}
.amt input{width:60%;font-size:44px;font-weight:800;text-align:center;border:0;background:none;outline:0;letter-spacing:-1.5px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.cats button{padding:10px 0;border-radius:16px;background:var(--card2);font-size:10px;font-weight:700;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;transition:.25s cubic-bezier(.34,1.56,.64,1)}
.cats button span{font-size:20px}.cats button.on{border-color:var(--c);color:var(--tx);transform:scale(1.06)}
.f{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card2);font-size:14px;margin-bottom:10px;outline:0;transition:.2s}
.f:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(108,92,231,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:4px}.acts .btn{flex:1;padding:15px;font-size:15px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.34,1.56,.64,1);z-index:80;white-space:nowrap;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{color:var(--ac2);font-weight:800;font-size:13px}
.sheet{max-height:92vh;overflow-y:auto}
.lb{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin:0 2px 5px}.lb span{font-weight:600;color:var(--ac)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:14px;background:var(--card2);margin-bottom:10px;font-size:13px;font-weight:700;color:var(--tx2)}.tot b{font-size:18px;color:var(--grn)}
.tg{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:14px;background:var(--card2);font-weight:700;font-size:13px;margin-bottom:10px;text-align:left}.tg small{color:var(--tx2);font-weight:600}
.tg i{width:38px;height:22px;border-radius:12px;background:var(--bd);position:relative;transition:.3s}.tg i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.tg.on i{background:var(--ac)}.tg.on i::after{transform:translateX(16px)}
.mn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--sh);margin:12px 0;font-weight:800;font-size:13px}.mn button{width:34px;height:34px;border-radius:11px;background:var(--card2);font-size:15px}
.pe{display:block;width:100%;text-align:left;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);margin-bottom:10px;transition:transform .2s}.pe:active{transform:scale(.98)}
.pe .t{display:flex;justify-content:space-between;align-items:center}.pe .t b{font-size:15px}.pe small{font-size:11px;color:var(--tx2);font-weight:600;display:block;margin-top:2px}
.pe .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pe .g div{background:var(--card2);border-radius:12px;padding:8px 9px;font-size:10px;color:var(--tx2);font-weight:700}.pe .g b{display:block;color:var(--tx);font-size:12px;margin-top:2px}
.pe .rm{margin-top:9px;font-size:12px;color:var(--tx2);font-weight:600}
.lr{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);margin-bottom:8px}.lr input{width:19px;height:19px;accent-color:var(--ac);flex-shrink:0}.lr .m{flex:1;min-width:0}.lr .m b{font-size:13px;display:block}.lr small{font-size:10px;color:var(--tx2);font-weight:600;display:block;margin-top:2px}.lr .r{text-align:right;font-size:11px;font-weight:700;color:var(--tx2);line-height:1.6}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.btns .btn{padding:13px 8px}.mny{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mny .stat{padding:11px}.mny b{font-size:13px}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div><h1 style="display:flex;align-items:center;gap:10px"><img src="icon-192.png?v=2" alt="" width="36" height="36" style="border-radius:11px;box-shadow:0 4px 14px rgba(108,92,231,.4)">Expense</h1><small id="sub"></small></div><div style="display:flex;gap:8px"><button class="ib" id="gbtn" aria-label="Settings">⚙️</button><button class="ib" id="tbtn" aria-label="Theme">🌙</button></div></div>
 <section class="view on" id="v-home"></section>
 <section class="view" id="v-hist"></section>
 <section class="view" id="v-bud"></section>
 <section class="view" id="v-ins"></section>
 <section class="view" id="v-petrol"></section>
 <section class="view" id="v-stu"></section>
 <section class="view" id="v-sprof"></section>
 <section class="view" id="v-set"></section>
 <section class="view" id="v-spl"></section>
 <section class="view" id="v-grp"></section>
</div>
<div class="nav"><div class="nb" id="nb">
 <button data-v="home" class="on"><span>🏠</span>Home</button>
 <button data-v="hist"><span>🧾</span>History</button>
 <button class="fab" id="fab" aria-label="Add">+</button>
 <button data-v="bud"><span>🎯</span>Budget</button>
 <button data-v="ins"><span>📊</span>Insights</button>
</div></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sh">
 <div class="grab"></div><h2 id="sht">Add Expense</h2>
 <div class="amt"><span>Rs</span><input id="fa" type="number" inputmode="decimal" placeholder="0"></div>
 <div class="cats" id="fc"></div>
 <div id="fx"></div>
 <input class="f" id="fn" type="text" placeholder="Note (e.g. Lunch, Petrol)">
 <input class="f" id="fd" type="date">
 <div class="acts"><button class="btn d" id="fdel" style="display:none;flex:.5">🗑</button><button class="btn" id="fs">Save Expense</button></div>
</div>
<div class="sheet" id="ps"><div class="grab"></div><h2 id="pst">Add Petrol</h2>
 <div class="two"><div><label class="lb">Date</label><input class="f" id="pd" type="date"></div><div><label class="lb">Bike</label><select class="f" id="pb"></select></div></div>
 <input class="f" id="pbn" placeholder="New bike name (e.g. Pulsar 150)" style="display:none">
 <label class="lb">Odometer (km) <span id="ph"></span></label><input class="f" id="po" type="number" inputmode="decimal" placeholder="e.g. 12700">
 <div class="two"><div><label class="lb">Litres</label><input class="f" id="pl" type="number" inputmode="decimal" placeholder="e.g. 5"></div><div><label class="lb">Rate / litre</label><input class="f" id="pr" type="number" inputmode="decimal" placeholder="e.g. 170"></div></div>
 <div class="tot"><span>Total cost (auto)</span><b id="pt">Rs 0</b></div>
 <button class="tg on" id="pf" type="button"><i></i>Full tank <small>&nbsp;for accurate mileage</small></button>
 <input class="f" id="pm" type="text" placeholder="Remarks (optional)">
 <div class="acts"><button class="btn d" id="pdel" style="display:none;flex:.5">🗑</button><button class="btn" id="psv">Save Petrol</button></div></div>
<div class="sheet" id="gs"><div class="grab"></div><h2 id="gt"></h2><div id="gb"></div></div>
<div class="toast" id="ts"></div>
<script>
const C={bike:{n:'Bike',e:'🏍️',c:'#22c08a',b:5000},food:{n:'Food',e:'🍔',c:'#f5a524',b:8000},clothes:{n:'Clothes',e:'👕',c:'#6c7bff',b:3000},friends:{n:'Friends',e:'👥',c:'#f472b6',b:2000},others:{n:'Others',e:'📦',c:'#38bdf8',b:4000}};
const K='lem_pro_v1',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let S={tx:[],pet:[],bikes:[],stu:[],grp:[],cc:[],ord:[],hid:{},cur:'Rs',bud:{},theme:''};
try{const d=JSON.parse(localStorage.getItem(K));if(d)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>S.cur+' '+Math.round(n).toLocaleString('en-IN');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const bud=k=>S.bud[k]!=null?S.bud[k]:C[k].b;
const sum=a=>a.reduce((s,t)=>s+t.a,0);
const allTx=()=>S.tx.concat(S.pet.map(p=>({id:p.id,c:'bike',n:'Petrol · '+p.bike,a:p.total,d:p.d,p:1,sub:'Petrol'})));const mt=m=>allTx().filter(t=>t.d.startsWith(m));const f2=n=>S.cur+' '+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const shiftM=(m,n)=>{const[y,mo]=m.split('-').map(Number),d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mlabel=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en',{month:'long',year:'numeric'})};
let M=today().slice(0,7),view='home',flt='all',q='',editId=null,selCat='food',undoTx=null,tt;

function cu(el,to){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);el.textContent=fmt(to*(1-Math.pow(1-p,4)));if(p<1)requestAnimationFrame(f)})(t0)}
function toast(msg,undo){const t=$('#ts');t.innerHTML=esc(msg)+(undo?'<button id="un">Undo</button>':'');t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),undo?4500:2000);
 if(undo)$('#un').onclick=()=>{if(undoTx){S.tx.push(undoTx);undoTx=null;save();render();t.classList.remove('on')}}}
function rowH(t){const c=C[t.c];return `<button class="row" data-id="${t.id}" data-p="${t.p||''}"><div class="ti" style="background:${c.c}22">${t.p?'⛽':c.e}</div><div class="m"><b>${esc(t.c==='friends'&&t.fr?t.fr:(t.n||c.n))}</b><span>${[c.n,det(t),t.d].filter(Boolean).join(' · ')}</span></div><div class="a">−${fmt(t.a)}</div></button>`}
function bindRows(root){root.querySelectorAll('.row').forEach(r=>r.onclick=()=>r.dataset.p?openPet(+r.dataset.id):openSheet(+r.dataset.id))}

function donut(parts,tot){const R=54,L=2*Math.PI*R;let o=0,s='<svg viewBox="0 0 140 140" class="dn"><circle cx="70" cy="70" r="54" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="16"/>';

 <div class="sec">Categories · show / hide & reorder</div><div class="list">${ck(1).map(k=>`<div class="row"><div class="ti" style="background:${C[k].c}22">${C[k].e}</div><div class="m"><b>${esc(C[k].n)}</b>${k.startsWith('cc_')?'<span>Custom</span>':''}</div>${k.startsWith('cc_')?`<button class="ib" style="width:32px;height:32px" data-e="${k}">✎</button>`:''}<button class="ib" style="width:30px;height:30px" data-u="${k}">▲</button><button class="ib" style="width:30px;height:30px" data-d="${k}">▼</button>${sw(!S.hid[k],'data-h="'+k+'"')}</div>`).join('')}<div class="row"><div class="m"><b>🎓 Student Fees</b></div>${sw(!S.hid.stu,'data-h="stu"')}</div><div class="row"><div class="m"><b>🤝 Split</b></div>${sw(!S.hid.spl,'data-h="spl"')}</div></div>
 <button class="btn" id="scc" style="width:100%;margin-top:12px">✨ Create your own category</button>
 <div class="sec">Data</div><div class="set"><button id="bk">☁️ Backup data (JSON)</button><button id="rs">📥 Restore from backup</button><button id="cl" style="color:var(--red)">🗑️ Clear all data</button></div><div class="sec">About</div><div class="list"><div class="row"><div class="m"><b>Life Expense Manager</b><span>Version 3.0</span></div></div></div>`;
 const mv=(k,n)=>{const o=ck(1),i=o.indexOf(k),j=i+n;if(j<0||j>=o.length)return;o.splice(i,1);o.splice(j,0,k);S.ord=o;save();setView()};
 $('#xb').onclick=()=>go('home');$('#st1').onclick=()=>{$('#tbtn').click();setView()};$('#scu').onchange=e=>{S.cur=e.target.value;save();toast('Currency updated ✓')};$('#scc').onclick=()=>ccOpen();
 el.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.hid[b.dataset.h]=!S.hid[b.dataset.h];save();setView()});el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>mv(b.dataset.u,-1));el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>mv(b.dataset.d,1));el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>ccOpen(b.dataset.e));
 $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='expense-backup-'+today()+'.json';a.click();toast('Backup downloaded')};
 $('#rs').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d.tx)){S=Object.assign(S,d);regCC();save();render();toast('Data restored ✓')}else toast('Invalid file')}catch(x){toast('Restore failed')}};r.readAsText(e.target.files[0])};i.click()};
 
 $('#cl').onclick=()=>{if(confirm('Delete ALL expense data?')){S.tx=[];S.pet=[];S.bikes=[];S.stu=[];S.grp=[];S.cc.forEach(c=>{delete C[c.k];delete X[c.k]});S.cc=[];S.ord=[];save();render();toast('All data cleared')}}}
$('#gbtn').onclick=()=>go('set');
const splTile=()=>S.hid.spl?'':`<button class="tile" id="ptile" style="grid-column:1/-1;display:flex;align-items:center;gap:12px"><div class="ti" style="background:#22c08a22;margin:0">🤝</div><div style="flex:1"><b>Split</b><span>${S.grp.length} group${S.grp.length===1?'':'s'}</span></div><span style="font-size:20px;color:var(--tx2)">›</span></button>`;
let gid=null;const gp=()=>S.grp.find(g=>g.id===gid);
function bal(g){const b={};g.mem.forEach(m=>b[m]=0);g.exp.forEach(e=>{b[e.by]=(b[e.by]||0)+e.a;Object.entries(e.sh).forEach(([k,v])=>b[k]=(b[k]||0)-v)});g.set.forEach(x=>{b[x.from]=(b[x.from]||0)+x.a;b[x.to]=(b[x.to]||0)-x.a});return b}
function simp(b){const c=[],d=[];Object.entries(b).forEach(([k,v])=>{if(v>.5)c.push({k,v});else if(v<-.5)d.push({k,v:-v})});c.sort((x,y)=>y.v-x.v);d.sort((x,y)=>y.v-x.v);const r=[];let i=0,j=0;while(i<c.length&&j<d.length){const p=Math.min(c[i].v,d[j].v);r.push({from:d[j].k,to:c[i].k,a:Math.round(p)});c[i].v-=p;d[j].v-=p;if(c[i].v<.5)i++;if(d[j].v<.5)j++}return r}
function splView(){const el=$('#v-spl');el.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><button class="ib" id="xb">‹</button><b style="flex:1;font-size:18px">🤝 Split</b><button class="btn" id="xa">+ Group</button></div>`+(S.grp.length?S.grp.map(g=>{const b=bal(g)[g.me]||0;return `<button class="pe" data-id="${g.id}"><div class="t"><div><b>${esc(g.name)}</b><small>${g.mem.length} members · ${fmt(g.exp.reduce((a,e)=>a+e.a,0))} total</small></div>${badge(b>.5?'You get '+fmt(b):b<-.5?'You owe '+fmt(-b):'Settled',b>.5?'var(--grn)':b<-.5?'var(--red)':'var(--tx2)')}</div></button>`}).join(''):'<div class="list"><div class="empty"><div>🤝</div>No groups yet<br><button id="x1">Create group</button></div></div>');
 $('#xb').onclick=()=>go('home');$('#xa').onclick=createG;if($('#x1'))$('#x1').onclick=createG;el.querySelectorAll('.pe').forEach(c=>c.onclick=()=>{gid=+c.dataset.id;go('grp')})}
function createG(){openG('New Group',`<label class="lb">Group name</label><input class="f" id="gn" placeholder="Pokhara trip, Roommates…"><label class="lb">Your name</label><input class="f" id="gme" placeholder="How others see you"><label class="lb">Other members (comma separated)</label><input class="f" id="gms" placeholder="Aman, Priya, Ram"><div class="acts"><button class="btn" id="gok">Create Group</button></div>`);
 $('#gok').onclick=()=>{const n=$('#gn').value.trim(),me=$('#gme').value.trim()||'Me';if(!n){toast('Enter group name');return}const mem=[...new Set([me].concat($('#gms').value.split(',').map(x=>x.trim()).filter(Boolean)))],g={id:uid(),name:n,me,mem,exp:[],set:[]};S.grp.unshift(g);gid=g.id;save();closeSheet();go('grp');toast('Group created ✓')}}
function expOpen(){const g=gp();if(!g)return;openG('Add Expense',`<label class="lb">Title</label><input class="f" id="et" placeholder="Hotel, Dinner, Petrol…"><label class="lb">Amount</label><input class="f" id="ea" type="number" inputmode="decimal"><label class="lb">Paid by</label><select class="f" id="eb">${g.mem.map(m=>`<option ${m===g.me?'selected':''}>${esc(m)}</option>`).join('')}</select><label class="lb">Split equally between</label><div class="chips" style="padding:0 0 12px;flex-wrap:wrap">${g.mem.map(m=>`<button class="fc on" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div><div class="acts"><button class="btn" id="eok">Add Expense</button></div>`);
 $('#gb').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 $('#eok').onclick=()=>{const t=$('#et').value.trim(),a=parseFloat($('#ea').value),m=[...$('#gb').querySelectorAll('[data-m].on')].map(b=>b.dataset.m);if(!t||!(a>0)||!m.length){toast('Enter title, amount & members');return}const sh={};m.forEach(k=>sh[k]=+(a/m.length).toFixed(2));g.exp.unshift({id:uid(),t,a,by:$('#eb').value,sh,d:today()});save();closeSheet();render();toast('Expense added ✓')}}
function grpView(){const g=gp();if(!g){go('spl');return}const el=$('#v-grp'),b=bal(g),ds=simp(b),tot=g.exp.reduce((a,e)=>a+e.a,0);
 el.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><button class="ib" id="xb">‹</button><b style="flex:1;font-size:18px">${esc(g.name)}</b><button class="ib" id="gdl">🗑</button></div>
 <div class="mny" style="margin-top:0"><div class="stat"><small>Total</small><b>${fmt(tot)}</b></div><div class="stat"><small>Pending</small><b style="color:var(--red)">${fmt(ds.reduce((a,d)=>a+d.a,0))}</b></div><div class="stat"><small>Members</small><b>${g.mem.length}</b></div></div>
 <div class="btns"><button class="btn" id="gx">+ Expense</button><button class="btn s" id="gm">+ Member</button></div><div class="sec">Who owes what</div>`+(ds.length?`<div class="list">${ds.map((d,i)=>`<div class="row"><div class="m"><b>${esc(d.from)} → ${esc(d.to)}</b></div><div class="a" style="color:var(--red)">${fmt(d.a)}</div><button class="btn s" data-st="${i}" style="padding:8px 12px">Settle</button></div>`).join('')}</div>`:'<div class="list"><div class="empty">🎉 All settled</div></div>')
 +`<div class="sec">Balances</div><div class="list">${g.mem.map(m=>{const v=b[m]||0;return `<div class="row"><div class="m"><b>${esc(m)}${m===g.me?' (you)':''}</b></div><div class="a" style="color:${v>.5?'var(--grn)':v<-.5?'var(--red)':'var(--tx2)'}">${v>.5?'gets '+fmt(v):v<-.5?'owes '+fmt(-v):'Settled'}</div></div>`}).join('')}</div><div class="sec">Expenses</div>`+(g.exp.length?`<div class="list">${g.exp.map(e=>`<button class="row" data-x="${e.id}"><div class="m"><b>${esc(e.t)}</b><span>Paid by ${esc(e.by)} · ${e.d} · tap to delete</span></div><div class="a">${fmt(e.a)}</div></button>`).join('')}</div>`:'<div class="list"><div class="empty">No expenses yet</div></div>');
 $('#xb').onclick=()=>go('spl');$('#gx').onclick=expOpen;
 $('#gm').onclick=()=>{openG('Add Member','<input class="f" id="mn" placeholder="Member name"><div class="acts"><button class="btn" id="mok">Add</button></div>');$('#mok').onclick=()=>{const n=$('#mn').value.trim();if(!n||g.mem.includes(n)){toast('Enter a new name');return}g.mem.push(n);save();closeSheet();render()}};
 $('#gdl').onclick=()=>{if(confirm('Delete "'+g.name+'" and all its data?')){S.grp=S.grp.filter(x=>x.id!==g.id);save();go('spl');toast('Group deleted')}};
 el.querySelectorAll('[data-st]').forEach(x=>x.onclick=()=>{const d=ds[+x.dataset.st];g.set.push({id:uid(),from:d.from,to:d.to,a:d.a,d:today()});save();render();toast(d.from+' paid '+fmt(d.a)+' to '+d.to)});
 el.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{if(confirm('Delete this expense?')){g.exp=g.exp.filter(e=>e.id!==+x.dataset.x);save();render()}})}
function render(){({home,hist,bud:budget,ins:insights,petrol:petrolView,set:setView,spl:splView,grp:grpView,stu:stuView,sprof:profView}[view])();$('#sub').textContent=new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'})}
function go(v){view=v;$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('#nb button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo({top:0,behavior:'smooth'})}
$$('#nb button[data-v]').forEach(b=>b.onclick=()=>{if(b.dataset.v==='hist'&&view!=='hist')flt='all';go(b.dataset.v)});

function pickCat(k){selCat=k;selSub=(X[k]&&X[k].subs)?X[k].subs[0]:'';$$('#fc button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));drawFx()}
function buildCats(){const o=ck();if(!o.includes(selCat))selCat=o[0];$('#fc').innerHTML=o.map(k=>`<button data-k="${k}" style="--c:${C[k].c}"><span>${C[k].e}</span>${esc(C[k].n)}</button>`).join('');$$('#fc button').forEach(b=>b.onclick=()=>pickCat(b.dataset.k));$('.amt span').textContent=S.cur}
function openSheet(id){editId=id||null;const t=id&&S.tx.find(x=>x.id===id);
 $('#sht').textContent=t?'Edit Expense':'Add Expense';$('#fa').value=t?t.a:'';$('#fn').value=t?t.n:'';$('#fd').value=t?t.d:today();$('#fdel').style.display=t?'block':'none';$('#fs').textContent=t?'Update':'Save Expense';
 buildCats();pickCat(t?t.c:selCat);if(t)fillFx(t);$('#ov').classList.add('on');$('#sh').classList.add('on');if(!t)setTimeout(()=>$('#fa').focus(),350)}
function closeSheet(){$('#ov').classList.remove('on');$('#sh').classList.remove('on');$('#ps').classList.remove('on');$('#gs').classList.remove('on');$('#fa').blur()}
$('#fab').onclick=()=>view==='petrol'?openPet():view==='stu'?addStu():view==='sprof'?payOpen('full'):view==='spl'?createG():view==='grp'?expOpen():openSheet();$('#ov').onclick=closeSheet;
$('#fs').onclick=()=>{const a=parseFloat($('#fa').value);if(!(a>0)){$('#fa').focus();toast('Enter an amount');return}
 const o=Object.assign({c:selCat,n:$('#fn').value.trim(),a:a,d:$('#fd').value||today()},fxVals());
 if(editId){Object.assign(S.tx.find(x=>x.id===editId),o)}else S.tx.push(Object.assign({id:Date.now()},o));
 save();closeSheet();render();toast(editId?'Updated ✓':'Expense added ✓')};
$('#fdel').onclick=()=>{const i=S.tx.findIndex(x=>x.id===editId);if(i<0)return;undoTx=S.tx.splice(i,1)[0];save();closeSheet();render();toast('Expense deleted',true)};

function theme(t){if(t){document.documentElement.setAttribute('data-theme',t);$('#tbtn').textContent=t==='dark'?'☀️':'🌙'}}
const isDark=()=>document.documentElement.getAttribute('data-theme')?document.documentElement.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
$('#tbtn').onclick=()=>{S.theme=isDark()?'light':'dark';theme(S.theme);save()};
theme(S.theme||(isDark()?'dark':'light'));
regCC();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{if(location.protocol==='https:'||location.hostname==='localhost')navigator.serviceWorker.register('sw.js').then(r=>r.update().catch(()=>{})).catch(e=>console.log('SW:',e.message))})}
</script>
